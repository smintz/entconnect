name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # workflow_dispatch (manual trigger only) is required infrastructure
  # for the sweep-exploratory job below (Plan 03-05 Task 3, D-14) to be
  # dispatchable at all — it carries no schedule and no branch filter of
  # its own, so it changes nothing about when push/pull_request fire.
  # The sweep-exploratory job's own `if:` gate is what keeps it off the
  # push/pull_request event path even though this trigger now exists.
  workflow_dispatch:

# Concurrency note: scripts/pipeline.sh documents itself as serial-only
# because steps 2/3 write generated output to fixed paths. These three
# jobs never share a checkout at runtime (each gets its own GitHub Actions
# runner and its own `actions/checkout`), so running them concurrently as
# separate jobs does not violate that constraint — only running the
# pipeline script itself twice against ONE checkout would.
jobs:
  # modules: builds/vets/tests BOTH modules from the explicit MODULES list
  # (D-16, PIPE-03). Never `go build ./...` from the repo root alone — Go
  # does not descend into mixinforproto's nested go.mod, so a root-only
  # job would go green while mixinforproto is silently broken
  # (PITFALLS.md Pitfall 12, trap 1).
  modules:
    name: modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build both modules
        run: make build

      - name: Vet both modules
        run: make vet

      - name: Test both modules
        run: make test

      # D-20/CRUD-06: the golden suite (entc/testdata) and every other test
      # in both modules run under -count=5 so order-dependence (an
      # accidental map-iteration dependency, an unsorted key set) surfaces
      # as a reproducible CI failure rather than a flake nobody can pin
      # down. This is the exact command make test-determinism runs locally.
      - name: Run the golden suite with -count=5 (D-20)
        run: make test-determinism

      - name: Verify no committed go.mod declares a local-path substitution
        run: make check-modules

      # PIPE-03 gap closure: mixinforproto/go.mod's `go` directive pin is
      # load-bearing (see Makefile's check-goversion target) — a bare
      # `go mod tidy` silently raises it through the transitive TEST-only
      # dependency chain entc/gen -> ariga.io/atlas -> hcl/v2, which has
      # already happened unnoticed twice this phase.
      - name: Verify mixinforproto/go.mod's go directive pin
        run: make check-goversion

      # WR-07 gap closure (03-07): a whole-repo, source-text invariant with
      # no module resolution at all -- unlike check-dep-parity, this gate
      # has no GOWORK=off requirement, so the `modules` job (which already
      # runs make build/vet/test) is the natural host. Deliberately NOT
      # added to the `standalone` job below, which exists specifically for
      # the GOWORK=off proof; adding it there would imply a
      # workspace-resolution dependency this gate does not have.
      - name: Verify VAL-07's single ValidationError construction site
        run: make check-single-validationerror-site

      - name: Install buf (pinned)
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0

      - name: Install protoc-gen-go (pinned)
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      - name: Install protoc-gen-connect-go (pinned)
        run: go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      # PIPE-01's own must-have is "CI runs it" — not just a script that
      # exists and is exercised locally. This job's checkout is ephemeral
      # (nothing here is committed back), so running the pipeline against
      # it directly is fine; that is different from the stubs job below,
      # which must not mutate the checkout IT is diffing against.
      - name: Run the canonical pipeline script (PIPE-01)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          bash scripts/pipeline.sh

  # standalone: the dedicated GOWORK=off job required by D-17/PIPE-02.
  # Runs in a checkout that still CONTAINS go.work, relying on the
  # GOWORK=off environment variable to ignore it — proving standalone
  # consumption without workspace resolution papering over a missing
  # dependency (ARCHITECTURE.md Anti-Pattern 5). Deleting go.work instead
  # of setting GOWORK=off would test a different thing.
  #
  # 02-01 adds the root-module half of this job (D-21, checkpoint v0-1-0):
  # the root module's first real dependency edge —
  # github.com/smintz/entconnect/mixinforproto v0.1.0 — is only a genuine,
  # standalone-resolvable Go module dependency if it resolves through the
  # module proxy via the published tag with GOWORK=off, not merely because
  # go.work's `use ./mixinforproto` makes it workspace-visible.
  standalone:
    name: standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Confirm go.work is present in this checkout
        run: test -f go.work

      - name: Build and test mixinforproto standalone (GOWORK=off)
        run: make test-standalone

      - name: Build and test the root module standalone (GOWORK=off)
        run: make test-standalone-root

      # VAL-11/D-15: this job is the correct (and only) host for the
      # dependency-parity gate — GOWORK=off is what makes root and
      # mixinforproto resolve D-15's five named modules INDEPENDENTLY;
      # go.work's workspace unification would otherwise mask a real
      # version skew between the two go.mod files. See the Makefile
      # target's own doc comment for the full rationale.
      - name: Verify D-15 dependency parity between root and mixinforproto (GOWORK=off)
        run: make check-dep-parity

  # stubs: the Pitfall 9 / D-22 staleness gate (scripts/check-stubs.sh).
  # Copies the working tree's proto/ into an empty temp root (never the
  # committed checkout's generated output — a CI job must not mutate the
  # checkout it is diffing against), regenerates from scratch via
  # scripts/generate-stubs.sh, and diffs against the committed stubs. A
  # from-scratch output tree is what lets this catch ORPHANED generated
  # files (source .proto message renamed/removed), not only modified ones.
  # This job and a developer's local `make check-stubs` run byte-identical
  # logic (scripts/check-stubs.sh), so a red job here is reproducible
  # locally without pushing.
  stubs:
    name: stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install buf (pinned)
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0

      - name: Install protoc-gen-go (pinned)
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      - name: Install protoc-gen-connect-go (pinned)
        run: go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Run the staleness gate (scripts/check-stubs.sh)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make check-stubs

  # sweep-exploratory: Plan 03-05 Task 3's opt-in, time-seeded run of the
  # PIPE-06 differential sweep (mixinforproto/internal/difftest/
  # sweep_test.go, D-14). workflow_dispatch ONLY — deliberately absent
  # from the `on:` push/pull_request block above, which stays unchanged —
  # so this job never makes REQUIRED CI flaky: the required `modules` job
  # already runs this same sweep under its own name-derived, clock-free
  # seed (make test-determinism), which is what -count=5 checks for
  # order-independence. This job instead explores value space a fixed
  # seed structurally cannot reach, by setting SWEEP_EXPLORATORY_SEED
  # from the shell's own clock (`date +%s`) — sweep_test.go's Go code
  # itself never imports "time" and never reads the clock directly (see
  # sweep_test.go's exploratorySeedOffset doc comment); only this job's
  # own shell step does, keeping sweepSeedFor's "pure function of the
  # message name" property intact for every other caller.
  #
  # Whether this job ALSO runs on a schedule (e.g. nightly) is a
  # CI-policy call deliberately left out of this phase — workflow_dispatch
  # (manual trigger) is the only entry point Task 3 adds.
  sweep-exploratory:
    name: sweep-exploratory
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run the PIPE-06 differential sweep with a time-derived seed
        working-directory: mixinforproto
        run: |
          export SWEEP_EXPLORATORY_SEED="$(date +%s)"
          echo "SWEEP_EXPLORATORY_SEED=${SWEEP_EXPLORATORY_SEED}"
          go test ./internal/difftest/... -run TestSweep_DriverlessDifferential -v
