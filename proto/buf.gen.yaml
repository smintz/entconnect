version: v2
# Managed mode computes each generated file's go_package from its proto
# package, flattened to a single identifier segment (mixinforprototest.v1
# -> mixinforprototestv1) so the generated tree lands at a predictable,
# flat path under mixinforproto/internal/gen/ rather than mirroring the
# proto package's dotted/versioned directory structure.
#
# Plan 02 generalizes Plan 01's per-file override (which named only
# tracer.proto) to a module-wide override with no `path` restriction —
# every corpus file lives in the same package (mixinforprototest.v1) and
# needs the same flat go_package, so one entry now covers tracer.proto
# plus every Plan 02 corpus file without hand-listing each path.
managed:
  enabled: true
  override:
    # Plan 05 scopes this override to mixinforprototest/** only (it was
    # previously unrestricted — see this file's git history). buf/validate
    # (the vendored protovalidate corpus dependency, see
    # buf/validate/validate.proto's own header) already carries its own
    # correct go_package option pointing at the real, already-published
    # buf.build/gen/go/bufbuild/protovalidate/protocolbuffers/go/buf/validate
    # Go package — the one buf.build/go/protovalidate's ResolveFieldRules
    # already depends on transitively. Overriding it too would make
    # protoc-gen-go treat buf/validate's types as local to
    # mixinforprototestv1 instead of importing the real published package,
    # producing an undefined `file_buf_validate_validate_proto_init`
    # reference the moment any corpus file imports it (verified live this
    # session — constraints.proto is the first file that does).
    - file_option: go_package
      path: mixinforprototest
      value: github.com/smintz/entconnect/mixinforproto/internal/gen/mixinforprototestv1
plugins:
  - local: protoc-gen-go
    out: ../mixinforproto
    opt: module=github.com/smintz/entconnect/mixinforproto
