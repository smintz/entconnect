version: v2
# Managed mode computes each generated file's go_package from its proto
# package, flattened to a single identifier segment (mixinforprototest.v1
# -> mixinforprototestv1) so the generated tree lands at a predictable,
# flat path under mixinforproto/internal/gen/ rather than mirroring the
# proto package's dotted/versioned directory structure.
#
# Plan 02 generalizes Plan 01's per-file override (which named only
# tracer.proto) to a module-wide override with no `path` restriction —
# every corpus file lives in the same package (mixinforprototest.v1) and
# needs the same flat go_package, so one entry now covers tracer.proto
# plus every Plan 02 corpus file without hand-listing each path.
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/smintz/entconnect/mixinforproto/internal/gen/mixinforprototestv1
plugins:
  - local: protoc-gen-go
    out: ../mixinforproto
    opt: module=github.com/smintz/entconnect/mixinforproto
